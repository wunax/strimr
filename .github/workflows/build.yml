name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  ios-build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: iOS build
        run: |
          xcodebuild \
            -project Strimr.xcodeproj \
            -scheme Strimr \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            build

  tvos-build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: tvOS build
        run: |
          xcodebuild \
            -project Strimr.xcodeproj \
            -scheme Strimr-tvOS \
            -destination 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation)' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            build

  macos-build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure macOS tests
        run: |
          cp Config/Config-example.xcconfig Config/Config.xcconfig
          printf '\nPRODUCT_BUNDLE_IDENTIFIER = app.strimr.ci\n' >> Config/Config.xcconfig
          touch Config/Config-TopShelf.xcconfig

      - name: macOS build and tests
        run: |
          xcodebuild \
            -project Strimr.xcodeproj \
            -scheme Strimr-macOS \
            -destination 'platform=macOS' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload macOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-results
          path: build/TestResults.xcresult
          if-no-files-found: ignore
